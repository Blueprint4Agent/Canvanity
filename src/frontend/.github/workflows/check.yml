name: Frontend checks
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: frontend-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: false
jobs:
    frontend:
        name: Frontend checks
        runs-on: ubuntu-latest
        env:
            VERIFY_BASE: HEAD
            VERIFY_HEAD: HEAD
            VERIFY_FULL: "1"
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Plan verification
              id: scope
              run: python3 scripts/verification.py plan --github-output "$GITHUB_OUTPUT"
            - name: Verify scope harness
              run: make verification-test
            - uses: actions/setup-node@v6
              if: steps.scope.outputs.node == 'true'
              with:
                  node-version: "24"
                  cache: npm
            - run: make install
              if: steps.scope.outputs.node == 'true'
            - run: npx playwright install --with-deps chromium
              if: steps.scope.outputs.browser == 'true'
            - name: Run selected verification
              run: make verify
